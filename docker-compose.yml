services:
  # ============================================================================
  # SERVIÇO 1: Banco de Dados (PostgreSQL)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: ticket-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Persistência: Salva os dados do banco num volume gerenciado pelo Docker
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # O Docker verifica a cada 5s se o banco está pronto para aceitar conexões
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432" # Opcional: Permite você acessar o banco via DBeaver localmente

  # ============================================================================
  # SERVIÇO 2: Cache (Redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # ============================================================================
  # SERVIÇO 3: API (Sua Aplicação)
  # ============================================================================
  app:
    build: .  # Usa o Dockerfile que criamos ontem
    container_name: ticket-api
    restart: always
    # Sobrescreve o comando do Dockerfile para rodar as migrações antes de iniciar
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # O 'Buraco de Minhoca': Conecta a pasta app do seu PC à pasta /app/app do container
      # Isso permite que o --reload funcione quando você salva um arquivo no VS Code
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      # Só inicia a API depois que o Banco e o Redis estiverem 'Healthy' (saudáveis)
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

# Definição dos Volumes Persistentes
volumes:
  postgres_data: